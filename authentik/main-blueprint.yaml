# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
---
version: 1
metadata:
  name: Main Blueprint
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_core.group
    identifiers:
      name: "users"
    attrs:
      name: "users"
      parents:
        - "admins"
  - model: authentik_core.group
    identifiers:
      name: "admins"
    attrs:
      name: "admins"
      is_superuser: true
