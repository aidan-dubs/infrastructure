# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
---
version: 1
metadata:
  name: Open WebUI OAuth provider
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: open-webui-oauth-provider
    identifiers:
      name: Open WebUI
    attrs:
      name: Open WebUI
      include_claims_in_id_token: true
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_id: !File /secrets/open-webui-oauth-client-id
      client_secret: !File /secrets/open-webui-oauth-client-secret
      client_type: confidential
      grant_types:
        - authorization_code
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://prompt.%s/oauth/oidc/callback", !Env DOMAIN]
      logout_method: backchannel
      logout_uri:
        !Format ["https://prompt.%s/oauth/backchannel-logout", !Env DOMAIN]
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      sub_mode: user_username
  - model: authentik_core.application
    identifiers:
      slug: open-webui
    attrs:
      name: Open WebUI
      provider: !KeyOf open-webui-oauth-provider
      meta_launch_url: !Format ["https://ai.%s", !Env DOMAIN]
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, open-webui]]
      group: !Find [authentik_core.group, [name, users]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
