# Combined NetBird Server Configuration (Simplified)
# Generated by getting-started.sh
server:
  listenAddress: ":80"
  exposedAddress: "https://net.${DOMAIN}:443"
  stunPorts:
    - 3478
  metricsPort: 9090
  healthcheckAddress: ":9000"
  logLevel: "info"
  logFile: "console"

  dataDir: "/var/lib/netbird"

  auth:
    localAuthDisabled: false
    issuer: "https://net.${DOMAIN}/oauth2"
    signKeyRefreshEnabled: true
    dashboardRedirectURIs:
      - "https://net.${DOMAIN}/nb-auth"
      - "https://net.${DOMAIN}/nb-silent-auth"
    cliRedirectURIs:
      - "http://localhost:53000/"

  reverseProxy:
    trustedHTTPProxies:
      - "10.12.0.5/32"

  store:
    engine: "sqlite"
