# Combined NetBird Server Configuration (Simplified)
# Generated by getting-started.sh
server:
  listenAddress: ":80"
  exposedAddress: "https://net.${DOMAIN}:443"
  stunPorts:
    - 3478
  metricsPort: 9090
  healthcheckAddress: ":9000"
  logLevel: "info"
  logFile: "console"

  dataDir: "/var/lib/netbird"

  auth:
    localAuthDisabled: true

  reverseProxy:
    trustedHTTPProxies:
      - "10.12.0.5/32"


  store:
    engine: "sqlite"
