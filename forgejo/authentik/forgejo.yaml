version: 1
metadata:
  name: Forgejo OAuth provider
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: forgejo-oauth-provider
    identifiers:
      name: Forgejo
    attrs:
      name: Forgejo
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]] invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_id: !File /run/secrets/forgejo-oauth-client-id
      client_secret: !File /run/secrets/forgejo-oauth-client-secret
      client_type: confidential
      grant_types:
        - authorization_code
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
      redirect_uris:
        - matching_mode: strict
          url: https://forge.${DOMAIN}/user/oauth2/authentik/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
  - model: authentik_core.application
    identifiers:
      slug: forgejo
    attrs:
      name: Forgejo
      provider: !KeyOf forgejo-oauth-provider
      meta_launch_url: https://forge.${DOMAIN}
