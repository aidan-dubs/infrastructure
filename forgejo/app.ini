APP_NAME = Forge
RUN_MODE = prod
WORK_PATH = /var/lib/forgejo
[server]
APP_DATA_PATH = /var/lib/forgejo
DOMAIN = forge.${DOMAIN}
ROOT_URL = https://forge.${DOMAIN}:443/
HTTP_PORT = 3000
SSH_ROOT_PATH = /var/lib/forgejo/.ssh
LFS_JWT_SECRET_URI = file:/run/secrets/forgejo-lfs-jwt-secret
START_SSH_SERVER = true
SSH_LISTEN_PORT = 2222
[database]
DB_TYPE = sqlite3
PATH = /var/lib/forgejo/forgejo.db
[security]
INSTALL_LOCK = true
SECRET_KEY_URI = file:/run/secrets/forgejo-secret-key
INTERNAL_TOKEN_URI = file:/run/secrets/forgejo-internal-token
[oauth2]
ENABLED = true
[log]
MODE = console
LEVEL = Info
ROOT_PATH = /var/lib/forgejo/log
[service]
REGISTER_EMAIL_CONFIRM = false
REGISTER_MANUAL_CONFIRM = false
DISABLE_REGISTRATION = false
ALLOW_ONLY_EXTERNAL_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = false
ENABLE_NOTIFY_MAIL = false
ENABLE_BASIC_AUTHENTICATION = false
DEFAULT_ALLOW_CREATE_ORGANIZATION = true
DEFAULT_USER_VISIBILITY = limited
DEFAULT_ORG_VISIBILITY = limited
ENABLE_TIMETRACKING = false
DEFAULT_ENABLE_TIMETRACKING = false
SHOW_REGISTRATION_BUTTON = false
ENABLE_INTERNAL_SIGNIN = false
AUTO_WATCH_NEW_REPOS = true
AUTO_WATCH_ON_CHANGES = false
[repository]
DEFAULT_PRIVATE = private
ENABLE_PUSH_CREATE_USER = true
ENABLE_PUSH_CREATE_ORG = true
DISABLED_REPO_UNITS = repo.wiki, repo.issues, repo.projects
DEFAULT_REPO_UNITS = repo.code,repo.releases,repo.pulls,repo.packages,repo.actions
DEFAULT_MIRROR_REPO_UNITS = repo.code,repo.releases,repo.issues,repo.wiki,repo.projects,repo.packages
DEFAULT_BRANCH = main
DEFAULT_MERGE_STYLE = rebase
DEFAULT_THEME = forgejo-auto
[markdown]
CUSTOM_URL_SCHEMES =
ENABLE_MATH = true
[admin]
USER_DISABLED_FEATURES = deletion,manage_gpg_keys,manage_gpg_keys,manage_password
[oauth2_client]
OPENID_CONNECT_SCOPES = profile email
ENABLE_AUTO_REGISTRATION = true
USERNAME = nickname
UPDATE_AVATAR = true
ACCOUNT_LINKING = auto
